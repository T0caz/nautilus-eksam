services:
  nautilus:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      APP_ORIGIN: http://127.0.0.1:3000
      APP_SECRET: ${APP_SECRET:?Generate .env with npm run setup first}
      DATABASE_PATH: /app/data/nautilus.sqlite
    volumes:
      - nautilus-data:/app/data
volumes:
  nautilus-data:
